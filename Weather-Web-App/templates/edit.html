
{% extends "base.html" %}

{% block title %}
Edit Weather Record
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow-sm border-0">

            <div class="card-header bg-warning">

                <h4 class="mb-0">
                    Update Weather Record
                </h4>

            </div>


            <div class="card-body">

                <form
                    action="/update/{{ record._id }}"
                    method="POST"
                >

                    <div class="row g-3">

                        <!-- Date -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Date
                            </label>

                            <input
                                type="date"
                                name="Date"
                                class="form-control"
                                value="{{ record.Date.strftime('%Y-%m-%d') if record.Date else '' }}"
                                required
                            >

                        </div>


                        <!-- Location -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Location
                            </label>

                            <input
                                type="text"
                                name="Location"
                                class="form-control"
                                value="{{ record.Location }}"
                                required
                            >

                        </div>


                        <!-- Minimum Temperature -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Minimum Temperature (°C)
                            </label>

                            <input
                                type="number"
                                step="any"
                                name="MinTemp"
                                class="form-control"
                                value="{{ record.MinTemp if record.MinTemp is not none else '' }}"
                                required
                            >

                        </div>


                        <!-- Maximum Temperature -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Maximum Temperature (°C)
                            </label>

                            <input
                                type="number"
                                step="any"
                                name="MaxTemp"
                                class="form-control"
                                value="{{ record.MaxTemp if record.MaxTemp is not none else '' }}"
                                required
                            >

                        </div>


                        <!-- Rainfall -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Rainfall (mm)
                            </label>

                            <input
                                type="number"
                                step="any"
                                name="Rainfall"
                                class="form-control"
                                value="{{ record.Rainfall if record.Rainfall is not none else '' }}"
                                required
                            >

                        </div>


                        <!-- Rain Today -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Rain Today
                            </label>

                            <select
                                name="RainToday"
                                class="form-select"
                                required
                            >

                                <option
                                    value="Yes"
                                    {% if record.RainToday == "Yes" %}
                                    selected
                                    {% endif %}
                                >
                                    Yes
                                </option>

                                <option
                                    value="No"
                                    {% if record.RainToday == "No" %}
                                    selected
                                    {% endif %}
                                >
                                    No
                                </option>

                            </select>

                        </div>


                        <!-- Buttons -->

                        <div class="col-12 mt-4">

                            <button
                                type="submit"
                                class="btn btn-warning px-4"
                            >
                                Update Record
                            </button>

                            <a
                                href="/crud"
                                class="btn btn-secondary px-4"
                            >
                                Cancel
                            </a>

                        </div>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
